<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add a New Habit</title>
  <link rel="stylesheet" href="css/add.css" />
</head>

<body>
  <header>
     <li><a href="index.html" class="active">Home</a></li>
    <li><a href="habit.html">Habit Details</a></li>
    <h1>Add Habit</h1>
  </header>

  <main>
     <section class="add-habit">
      <h2>Add a New Habit</h2>

      <form id="habitForm">
        <label for="habitName">Habit Name:</label>
        <input type="text" id="habitName" name="habitName" required />

        <label for="categorySelect">Category:</label>
        <select id="categorySelect" name="categorySelect" required>
          <option value="">--Select Category--</option>
          <option value="Health">Health</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
        </select>

        <label for="frequency">Frequency:</label>
        <select id="frequency" name="frequency" required>
          <option value="">--Select Frequency--</option>
          <option value="Daily">Daily</option>
          <option value="Weekly">Weekly</option>
        </select>

        <label for="notes">Notes:</label>
        <textarea id="notes" name="notes" placeholder="Add details here..."></textarea>

        <button type="submit">Add Habit</button>
      </form>
    </section>
   </main>

  <footer>
    <p>&copy; 2025 Habit Tracker</p>
  </footer>
  <script type="module" src="js/habit-details.js"></script>
</body>
</html>
