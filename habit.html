<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Habit Details</title>
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/habit.css" />
</head>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.querySelector(".menu-toggle");
    const menu = document.querySelector(".nav-links");

    if (btn && menu) {
      btn.addEventListener("click", () => menu.classList.toggle("open"));
    }
  });
</script>

<body>
  <header>
    <h1>Habit Tracker</h1>
    <nav class="navbar">
      <button class="menu-toggle" aria-label="Open Menu">☰</button>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a id="navHabitDetails" href="#">Habit Details</a></li>
        <li><a id="navAddHabit" href="#">Add Habit</a></li>
      </ul>
    </nav>
  </header>

  <!-- Dynamic details rendering happens here -->
  <main></main>

  <!-- ADD HABIT MODAL -->
  <div id="addHabitModal" class="modal hidden">
    <div class="modal-content">
      <button class="close-modal">&times;</button>

      <h2>Add New Habit</h2>

      <form id="modalHabitForm">
        <label for="mHabitName">Habit Name:</label>
        <input type="text" id="mHabitName" required />

        <label for="mCategorySelect">Category:</label>
        <select id="mCategorySelect" required>
          <option value="">--Select Category--</option>
          <option value="Health">Health</option>
          <option value="Work">Work</option>
          <option value="Personal">Personal</option>
        </select>

        <label for="mFrequency">Frequency:</label>
        <select id="mFrequency" required>
          <option value="">--Select Frequency--</option>
          <option value="Daily">Daily</option>
          <option value="Weekly">Weekly</option>
        </select>

        <label for="mNotes">Notes:</label>
        <textarea id="mNotes"></textarea>

        <button type="submit">Add Habit</button>
      </form>
    </div>
  </div>

  <!-- HABIT PICKER MODAL -->
  <div id="habitPickerModal" class="modal hidden" aria-hidden="true">
    <div class="modal-content picker-content">
      <button class="picker-close" aria-label="Close">&times;</button>
      <h2>Select a Habit to View</h2>
      <ul id="habitPickerList" class="picker-list"></ul>
    </div>
  </div>

  <footer>
    <p>&copy; 2025 Habit Tracker</p>
  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/habit-details.js"></script>
</body>
</html>
