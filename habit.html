<script>
  document.addEventListener("DOMContentLoaded", () => {
    const btn = document.querySelector(".menu-toggle");
    const menu = document.querySelector(".nav-links");

    if (btn && menu) {
      btn.addEventListener("click", () => {
        menu.classList.toggle("open");
      });
    }
  });
</script>


<body>

    <h1>Habit Tracker</h1>
    <nav class="navbar">
      <button class="menu-toggle" aria-label="Open Menu">☰</button>

        <li><a href="index.html?add=1">Add Habit</a></li>
      </ul>
    </nav>
  </header>


  <main>
    <section class="habit-detail">
      <h2 id="habitName">Drink Water</h2>
      <p><strong>Category:</strong> Health</p>
      <p><strong>Frequency:</strong> Daily</p>
      <p><strong>Notes:</strong> 8 cups per day</p>
      <p><strong>Streak:</strong> 5 days</p>
    </section>
  </main>

  <footer>

  </footer>
